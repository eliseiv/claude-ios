# РУЧНОЙ деплой по inventory CRM (ADR-115 §10.2). Автоматический деплой — джоб `deploy` в ci.yml
# (запускается только после зелёных quality + test + publish-image). Этот файл —
# `workflow_dispatch` ONLY: повторная выкатка текущего SHA без нового коммита, откат на прежний
# SHA (его образ уже лежит в GHCR) или раскатка на ЧАСТЬ серверов (`servers`).
#
# Шаги — те же, что в ci.yml, и живут в ОДНОМ месте: infra/fleet/ci/deploy-fleet.sh (inventory
# до любых изменений → серверы последовательно → R → повторный inventory → сверка образа api
# каждого active → отчёт в CRM). Образ НЕ собирается: деплой тянет ghcr.io/…/claude-ios:<SHA
# выбранного ref>, опубликованный джобом publish-image при push. Нет образа — docker pull падает
# на первом же сервере явно, ни один инстанс не тронут.
#
# `servers` (server_id через запятую) — неполный прогон: отчёт last_deployed_sha в CRM при нём
# НЕ пишется. Инфраструктурные выкатки (смена образа Postgres, включение архива WAL) идут не
# здесь, а инструментами флота поинстансно, порциями (ADR-115 §8.2, §10.2 п. 5, §11 фаза 4).
#
# ⛔ ADR-115 §11 фаза 3: запуск этого workflow на ref'е СТАРШЕ слияния нового CI запрещён — у
# такого ref свой, прежний deploy.yml: он выполнил бы `up -d` всех сервисов (пересоздав Postgres)
# и читал бы .role.
name: deploy

on:
  workflow_dispatch:
    inputs:
      servers:
        description: "server_id через запятую — раскатить только эти серверы (пусто = весь флот)"
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: manual deploy by CRM inventory
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Ключ SSH CI
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ci_key"

      - name: Deploy
        env:
          DEPLOY_SHA: ${{ github.sha }}
          SERVER_FILTER: ${{ inputs.servers }}
          FLEET_INVENTORY_URL: ${{ secrets.FLEET_INVENTORY_URL }}
          FLEET_INVENTORY_TOKEN: ${{ secrets.FLEET_INVENTORY_TOKEN }}
          FLEET_DEPLOY_REPORT_URL: ${{ secrets.FLEET_DEPLOY_REPORT_URL }}
          FLEET_DEPLOY_REPORT_TOKEN: ${{ secrets.FLEET_DEPLOY_REPORT_TOKEN }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY_FILE: ${{ runner.temp }}/ci_key
        run: bash infra/fleet/ci/deploy-fleet.sh

      - name: Удалить ключ SSH
        if: always()
        run: rm -f "$RUNNER_TEMP/ci_key"
