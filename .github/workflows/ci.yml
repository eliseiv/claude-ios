# CI gate + gated deploy (07-deployment.md §CI/CD, 06-testing-strategy.md §CI gate, ADR-115 §10).
# Any failure on lint / format / type-check / tests / coverage blocks merge AND blocks deploy.
#
# DEPLOY ORDERING: deploy is a JOB IN THIS WORKFLOW with `needs: [quality, test, publish-image]`,
# so GitHub will NOT start it until ALL CI jobs have succeeded. Manual / out-of-band redeploys live
# in deploy.yml (workflow_dispatch only — no push trigger).
#
# ADR-115 §10 (Р5): образ собирается ОДИН раз здесь и публикуется в GHCR
# (ghcr.io/<владелец>/claude-ios:<sha>); серверы образ НЕ собирают. Состав флота берётся из
# inventory CRM (FLEET_INVENTORY_URL + FLEET_INVENTORY_TOKEN), а не из хардкода: при недоступной
# CRM, пустом или противоречивом ответе прогон КРАСНЕЕТ, не тронув ни одного сервера. Деплой
# пересоздаёт только api (`--no-deps api`), .role не читает; после раскатки CI заново запрашивает
# inventory и сверяет образ api КАЖДОГО active инстанса — это и есть «изменения применились для
# всех инстансов», проверенное, а не предположенное. Логика — infra/fleet/ci/deploy-fleet.sh.
#
# ⛔ ADR-115 §11 фаза 3: этот файл выкатывается ПОСЛЕ импорта состава флота в CRM (фаза 2) и ДО
# любых изменений Postgres и .role. workflow_dispatch deploy.yml на ref'е старше этого слияния
# ЗАПРЕЩЁН — он вернул бы `up -d` всех сервисов и чтение .role.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# ВНИМАНИЕ: прежняя редакция утверждала, что эта группа «касается только CI-джоб, а деплой
# защищён своей группой deploy-production с cancel-in-progress: false». ЭТО НЕВЕРНО. Отмена на
# уровне ПРОГОНА убивает и джобу деплоя — её собственная группа от этого не спасает.
#
# Инцидент 2026-08-28: пуш во время выкатки отменил прогон ровно в тот момент, когда цикл дошёл
# до marqelio. Между `up -d` и убийством процесса прошло ТРИ СЕКУНДЫ: контейнер успел
# создаться и не успел стартовать, инстанс пролежал полчаса и обнаружился по жалобе. Хуже
# одного инстанса другое — обрыв посреди цикла оставляет флот РАЗДЕЛЁННЫМ между двумя
# коммитами: часть уже на новом, часть на старом.
#
# Поэтому отмена выключена. Плата — вытесненный прогон досматривает свои тесты вместо того,
# чтобы умереть сразу; несколько минут раннера против разъехавшегося прода.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_VERSION: "0.4.30"
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: lint • format • types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install deps (uv sync)
        run: uv sync --frozen

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy src

  test:
    name: test • coverage gate
    runs-on: ubuntu-latest
    # Integration/e2e use testcontainers, which need a Docker daemon (present on
    # ubuntu-latest runners). No service containers declared: testcontainers manages them.
    env:
      # Ryuk — контейнер-уборщик, который testcontainers поднимает, чтобы подчистить за собой на
      # ДОЛГОЖИВУЩЕЙ машине. Раннер GitHub уничтожается после джобы, поэтому здесь он не нужен, а
      # цена его есть: лишний pull с Docker Hub. Именно он и уронил прогон 32837143762 —
      # `images/create?fromImage=testcontainers/ryuk` вернул 500, следом ImageNotFound, и упали ВСЕ
      # интеграционные тесты, хотя код был исправен. Отключение убирает и зависимость, и pull.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install deps (uv sync)
        run: uv sync --frozen

      # ОДИН прогон pytest на оба гейта: раньше critical-гейт перегонял unit+integration заново (+27 мин).
      # xdist: -n auto по vCPU раннера; loadfile держит тесты файла в одном воркере (фикстуры модуля);
      # session-фикстура Postgres (testcontainers) поднимается в каждом воркере на своём порту.
      # pytest-cov сам объединяет данные воркеров в .coverage. Global gate 80% (02-tech-stack.md, 06-testing-strategy.md).
      - name: Pytest + coverage (global gate 80%)
        run: >
          uv run pytest
          -n auto
          --dist loadfile
          --cov=src
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80

      # Critical packages >=95% (06-testing-strategy.md §Coverage gate) — по данным того же прогона.
      - name: Critical-package coverage gate (policy/wallet/byok >=95%)
        run: >
          uv run coverage report
          --include='src/app/policy/*,src/app/wallet/*,src/app/byok/*'
          --show-missing
          --fail-under=95

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # ADR-115 §10.2 п. 1: образ приложения собирается ОДИН раз и публикуется в GHCR с тегом SHA.
  # На pull_request — только проверка сборки, без публикации.
  publish-image:
    name: build + publish image (GHCR)
    runs-on: ubuntu-latest
    needs: [quality, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Имя образа в fleet.conf (его читают инструменты на серверах) и имя, под которым публикует
      # этот джоб, обязаны совпадать: иначе серверы тянули бы образ, которого нет.
      - name: Имя образа совпадает с infra/fleet/fleet.conf
        id: img
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          want="ghcr.io/${owner}/claude-ios"
          have="$(sed -n 's/^APP_IMAGE_REPO=//p' infra/fleet/fleet.conf | tr -d '\r')"
          if [ "$want" != "$have" ]; then
            echo "::error::APP_IMAGE_REPO в infra/fleet/fleet.conf ($have) ≠ публикуемому образу ($want)"; exit 1
          fi
          echo "repo=$want" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to GHCR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.img.outputs.repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------------------------
  # Gated deploy по inventory CRM (ADR-115 §10.2). Запускается ТОЛЬКО на зелёном push в main.
  # Секреты (GitHub Secrets; значения не печатаются):
  #   FLEET_INVENTORY_URL, FLEET_INVENTORY_TOKEN   — чтение состава флота (§10.1);
  #   FLEET_DEPLOY_REPORT_URL, FLEET_DEPLOY_REPORT_TOKEN — запись last_deployed_sha (§10.2 п. 8);
  #   SSH_USER, SSH_PRIVATE_KEY                    — вход на серверы и R; host-ключи закрепляются
  #                                                  по inventory, секрет SSH_HOST больше не нужен.
  # Откат кода — перевыкатка прежнего тега образа из GHCR (deploy.yml на нужном ref, §Откат 07-deployment).
  deploy:
    name: deploy by CRM inventory
    runs-on: ubuntu-latest
    needs: [quality, test, publish-image]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && success() }}
    environment: production
    permissions:
      contents: read
    # Две выкатки не идут одновременно и не отменяют друг друга; от отмены всего прогона защищает
    # `cancel-in-progress: false` на уровне workflow (инцидент 2026-08-28).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Ключ SSH CI
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ci_key"

      - name: Deploy (inventory → серверы → повторный inventory → сверка образа → отчёт)
        env:
          DEPLOY_SHA: ${{ github.sha }}
          FLEET_INVENTORY_URL: ${{ secrets.FLEET_INVENTORY_URL }}
          FLEET_INVENTORY_TOKEN: ${{ secrets.FLEET_INVENTORY_TOKEN }}
          FLEET_DEPLOY_REPORT_URL: ${{ secrets.FLEET_DEPLOY_REPORT_URL }}
          FLEET_DEPLOY_REPORT_TOKEN: ${{ secrets.FLEET_DEPLOY_REPORT_TOKEN }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY_FILE: ${{ runner.temp }}/ci_key
        run: bash infra/fleet/ci/deploy-fleet.sh

      - name: Удалить ключ SSH
        if: always()
        run: rm -f "$RUNNER_TEMP/ci_key"
