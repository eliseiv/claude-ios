# Раздача таблицы ролей прикладным серверам. Только внутрь туннеля и только на чтение.
# Это единственный источник истины о том, кто сейчас основной: страж ролей на A и B
# спрашивает его при загрузке, и вернувшийся после аварии сервер не может самовольно
# объявить себя основным.
services:
  roles:
    image: python:3.12-alpine
    container_name: roles
    restart: unless-stopped
    working_dir: /srv
    command: ["python", "-m", "http.server", "8088", "--bind", "0.0.0.0", "--directory", "/srv"]
    volumes:
      # Монтируется КАТАЛОГ, а не файл. Поштучный монтаж файла ломается молча: `sed -i` и
      # `mv` создают новый inode, а контейнер продолжает держать прежний и отдавать устаревшую
      # таблицу. Дефект пойман на проверке 2026-08-26: в файле стояло B, наружу отдавалось A,
      # и страж ролей послушно понизил живой инстанс.
      - ./:/srv:ro
    ports:
      - "10.10.0.3:8088:8088"
