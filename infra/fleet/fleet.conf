# Несекретные константы инструментов флота (ADR-115 §13). Читается lib/common.sh.
# Секретов здесь нет и быть не может: файл лежит в репозитории и копируется на каждый сервер.

# Образ приложения в GHCR; тег — SHA коммита (ADR-115 §10.2 п. 1). Имя владельца — в нижнем
# регистре: так его публикует CI (.github/workflows/ci.yml, джоб publish-image).
APP_IMAGE_REPO=ghcr.io/eliseiv/claude-ios

# Адрес маршрутизатора R в туннеле (ADR-115 §2: 10.10.0.3 занят R).
ROUTER_WG_IP=10.10.0.3

# Каталоги на хосте (ADR-115 §2, §8.2, §8.7).
FLEET_ETC=/etc/fleet
WALG_DIR=/etc/fleet/walg
OBJSTORE_DIR=/etc/fleet/objstore
LOCK_DIR=/run/fleet
STATE_DIR=/var/lib/fleet

# Каталог маршрутов на R (ADR-115 §6.1): смонтирован в Traefik КАТАЛОГОМ.
ROUTER_DYNAMIC_DIR=/opt/router/dynamic
ROUTER_ROLES_FILE=/opt/router/roles/roles.tsv

# Диапазон портов api на сервере (ADR-115 §4.1).
API_PORT_MIN=18001
API_PORT_MAX=18999
