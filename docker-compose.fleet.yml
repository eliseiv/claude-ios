# Оверлей для схемы «два прикладных сервера + маршрутизатор» (docs/MIGRATION-3-SERVERS.md).
#
# На прежнем одиночном сервере Traefik жил на той же машине и находил контейнеры по меткам,
# поэтому api не публиковал портов вовсе. В новой схеме маршрутизатор стоит на ОТДЕЛЬНОЙ машине
# и добраться до контейнера по docker-меткам не может — значит порт нужно опубликовать.
#
# Оба порта публикуются ТОЛЬКО на адрес WireGuard (`WG_BIND_IP`), а не на 0.0.0.0: из интернета
# ни api, ни база напрямую недоступны. Единственный вход снаружи — маршрутизатор через туннель.
#
# Метки Traefik из базового файла остаются, но ни на что не влияют: на прикладных серверах
# Traefik не запускается. Они сохранены, чтобы возврат к прежней схеме не требовал правок.
services:
  api:
    ports:
      - "${WG_BIND_IP:?WG_BIND_IP не задан в .env}:${API_HOST_PORT:?API_HOST_PORT не задан в .env}:8000"
    environment:
      # Кому верить в определении адреса клиента. Это ИНФРАСТРУКТУРНАЯ привязка: адрес
      # маршрутизатора задаёт та же топология, которую описывает этот оверлей, — поэтому значение
      # живёт здесь, а не в `.env` каждого инстанса (`environment` перекрывает `env_file`).
      # Правка в 33 отдельных `.env` не является исправлением: переразвёртывание инстанса вернёт
      # прежнее значение, и ошибка воскреснет поодиночке и незаметно.
      #
      # ЗАЧЕМ. На прежней однохостовой схеме Traefik стоял в одной docker-сети с api, и в списке
      # доверия хватало `172.19.0.0/16`. В новой схеме запрос приходит от маршрутизатора по
      # туннелю с 10.10.0.3 — адреса, которого в списке не было. Приложение отбрасывало
      # `X-Forwarded-For` как недоверенный и принимало за клиента САМ МАРШРУТИЗАТОР: все
      # пользователи инстанса схлопывались в один адрес и делили лимит «на IP».
      # Инцидент 2026-08-30 (velunixa, 74k пользователей): 68 запросов в окне при лимите 10 на
      # регистрацию. Отказ порождал повтор, повтор — отказ; после снятия лимита реальный спрос
      # оказался 6 в минуту, то есть ВСЁ ВРЕМЯ был ниже исходного порога. Достаточно было
      # короткого всплеска, чтобы запустить самоподдерживающуюся лавину.
      #
      # ПОЧЕМУ ЭТО НЕ ДЫРА. Подделать адрес нельзя: маршрутизатор не настраивает
      # `forwardedHeaders.trustedIPs`, а Traefik по умолчанию затирает входящий `X-Forwarded-For`
      # реальным адресом узла. До api заголовок доходит ровно с одной записью — настоящей.
      TRUSTED_PROXY_IPS: "172.19.0.0/16,10.10.0.0/24"

  postgres:
    # Порт базы открыт ради потоковой репликации на соседний сервер. Он обязан быть виден
    # ТОЛЬКО в туннеле: replication-роль имеет право читать весь кластер целиком.
    ports:
      - "${WG_BIND_IP:?WG_BIND_IP не задан в .env}:${PG_HOST_PORT:?PG_HOST_PORT не задан в .env}:5432"
