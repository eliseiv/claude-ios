# Оверлей для схемы «два прикладных сервера + маршрутизатор» (docs/MIGRATION-3-SERVERS.md).
#
# На прежнем одиночном сервере Traefik жил на той же машине и находил контейнеры по меткам,
# поэтому api не публиковал портов вовсе. В новой схеме маршрутизатор стоит на ОТДЕЛЬНОЙ машине
# и добраться до контейнера по docker-меткам не может — значит порт нужно опубликовать.
#
# Оба порта публикуются ТОЛЬКО на адрес WireGuard (`WG_BIND_IP`), а не на 0.0.0.0: из интернета
# ни api, ни база напрямую недоступны. Единственный вход снаружи — маршрутизатор через туннель.
#
# Метки Traefik из базового файла остаются, но ни на что не влияют: на прикладных серверах
# Traefik не запускается. Они сохранены, чтобы возврат к прежней схеме не требовал правок.
services:
  api:
    ports:
      - "${WG_BIND_IP:?WG_BIND_IP не задан в .env}:${API_HOST_PORT:?API_HOST_PORT не задан в .env}:8000"

  postgres:
    # Порт базы открыт ради потоковой репликации на соседний сервер. Он обязан быть виден
    # ТОЛЬКО в туннеле: replication-роль имеет право читать весь кластер целиком.
    ports:
      - "${WG_BIND_IP:?WG_BIND_IP не задан в .env}:${PG_HOST_PORT:?PG_HOST_PORT не задан в .env}:5432"
